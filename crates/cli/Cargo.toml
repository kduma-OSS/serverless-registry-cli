[package]
name = "sreg-cli"
description = "Command-line tool for publishing packages to Serverless Registry."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "sreg"
path = "src/main.rs"

[features]
default = ["composer", "npm", "cargo", "nuget", "generic"]
# Each feature enables one ecosystem: its packager crate and its subcommand.
composer = ["dep:sreg-eco-composer"]
npm = ["dep:sreg-eco-npm"]
cargo = ["dep:sreg-eco-cargo"]
nuget = ["dep:sreg-eco-nuget"]
generic = ["dep:sreg-eco-generic"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
quick-xml.workspace = true
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sreg-core.workspace = true
sreg-eco-cargo = { workspace = true, optional = true }
sreg-eco-composer = { workspace = true, optional = true }
sreg-eco-generic = { workspace = true, optional = true }
sreg-eco-npm = { workspace = true, optional = true }
sreg-eco-nuget = { workspace = true, optional = true }
time.workspace = true
tokio.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
flate2.workspace = true
predicates.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
wiremock.workspace = true
zip.workspace = true
