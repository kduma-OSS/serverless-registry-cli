[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/eco-composer",
    "crates/eco-npm",
    "crates/eco-cargo",
    "crates/eco-generic",
    "crates/eco-nuget",
    "crates/eco-swift",
    "crates/eco-maven",
    "crates/cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/kduma-OSS/serverless-registry-cli"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
sreg-core = { path = "crates/core", version = "0.1.3" }
sreg-eco-composer = { path = "crates/eco-composer", version = "0.1.3" }
sreg-eco-npm = { path = "crates/eco-npm", version = "0.1.3" }
sreg-eco-cargo = { path = "crates/eco-cargo", version = "0.1.3" }
sreg-eco-generic = { path = "crates/eco-generic", version = "0.1.3" }
sreg-eco-nuget = { path = "crates/eco-nuget", version = "0.1.3" }
sreg-eco-swift = { path = "crates/eco-swift", version = "0.1.3" }
sreg-eco-maven = { path = "crates/eco-maven", version = "0.1.3" }

# Command line and logging
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
quick-xml = "0.41.0"

# HTTP
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time"] }
url = "2.5.8"
percent-encoding = "2.3.2"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"

# Hashing and encoding
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.23.1"

# Versions and time
semver = "1.0.28"
time = { version = "0.3.45", features = ["formatting", "parsing", "serde"] }

# Archives
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4.46"
flate2 = "1.1.10"

# Testing
tempfile = "3.27.0"
# 0.6.5 needs Rust 1.88 (let chains); keep the MSRV check green.
wiremock = "=0.6.4"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that cargo-dist builds release binaries with
[profile.dist]
inherits = "release"
