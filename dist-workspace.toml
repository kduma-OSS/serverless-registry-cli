[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Releases are started by the "Bump and release" workflow through workflow_dispatch,
# so a tag pushed with GITHUB_TOKEN needs no personal access token.
dispatch-releases = true
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Checksums to generate for each artifact
checksum = "sha256"
# Which actions to run on pull requests
pr-run-mode = "plan"
# After the GitHub Release: start the release of the GitHub Action with the new sreg as its
# default (.github/workflows/release-action.yml; see docs/releasing.md)
post-announce-jobs = ["./release-action"]
# Only the packages that opt in with `[package.metadata.dist] dist = true` are released
dist = false
